name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run pytest
        run: python -m pytest backend/tests -v

  dashboard:
    name: Dashboard (lint & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codelap-dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: codelap-dashboard/.nvmrc
          cache: npm
          cache-dependency-path: codelap-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck & build
        run: npm run build -- --base=/dashboard/

  mobile:
    name: Mobile (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: mobile/.nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

  docker:
    name: Production Docker image
    runs-on: ubuntu-latest
    needs: [backend, dashboard]
    steps:
      - uses: actions/checkout@v4

      - name: Build multi-stage Docker image
        run: docker build --tag stayput-ci .

  windows-launcher:
    name: Windows launcher (network selection)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate address selection and launcher syntax
        shell: pwsh
        run: ./tools/test_network.ps1
      - name: Exercise complete launcher with dual-stack Docker output
        shell: pwsh
        run: ./tools/test_launcher.ps1
      - name: Check Linux shell scripts retain LF line endings
        shell: pwsh
        run: |
          foreach ($path in @('start.sh', 'mobile/docker-start.sh')) {
            if ([System.IO.File]::ReadAllText($path).Contains("`r")) {
              throw "$path contains Windows CRLF line endings"
            }
          }
