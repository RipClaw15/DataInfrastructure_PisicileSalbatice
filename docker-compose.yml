# Reproducible local stack. Add --profile mobile to serve the phone app via Expo.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: stayput
      POSTGRES_USER: stayput
      # Development credentials only; do not reuse for cloud deployments.
      POSTGRES_PASSWORD: stayput_dev
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stayput -d stayput"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /
    environment:
      DATABASE_URL: postgresql+psycopg://stayput:stayput_dev@postgres:5432/stayput
      # Browser and API share an origin. This also allows an optional Vite client.
      CORS_ORIGINS: "http://localhost:${APP_PORT:-8000},http://localhost:5173,http://${LAN_IP:-localhost}:${APP_PORT:-8000}"
      PORT: "8000"
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5).read()"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 20s

  mobile:
    profiles: [mobile]
    build:
      context: .
      dockerfile: mobile/Dockerfile
    environment:
      LAN_IP: ${LAN_IP:-}
      REACT_NATIVE_PACKAGER_HOSTNAME: ${LAN_IP:-localhost}
      EXPO_PUBLIC_API_URL: http://${LAN_IP:-localhost}:${APP_PORT:-8000}
      METRO_PORT: ${METRO_PORT:-8081}
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    ports:
      - "${METRO_PORT:-8081}:${METRO_PORT:-8081}"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.METRO_PORT || '8081') + '/status').then(async r => { if (!r.ok || !(await r.text()).includes('packager-status:running')) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgres_data:
